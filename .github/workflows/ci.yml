# CI monorepo Z_SDK (WP-U03 / D-12 / ARQUITECTURA §5 paso 1).
# Publish/tag/GitHub Release: .github/workflows/release.yml (WP-U53), solo en main
# y solo tras quality+test verdes + secrets NPM_USERNAME/NPM_PASSWORD (_password).
name: CI

on:
  push:
    branches:
      - main
      - 'wp/**'
    # WP-U104 / D-22: bookkeeping plan + markdown no dispara matriz ~31 jobs.
    # `**.md` = todos los .md del repo (docs GHA: Pattern matching).
    paths-ignore:
      - 'plan/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'plan/**'
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # WP-U263 · la deriva entre este flujo y el de publicación se caza AQUÍ,
      # al empujar, y no sólo al publicar. El mismo paso vive en `release.yml`,
      # que es justamente lo que este comando comprueba.
      - name: Paridad de verificación CI ↔ publicación (WP-U263)
        run: node scripts/verificacion-paridad.mjs
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Gates (PRACTICAS §5)
        run: npm run gates
      - name: Gate unit tests
        run: npm run test:gates

  test:
    name: test ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - '@zeus/presets-sdk'
          - '@zeus/firehose-core'
          - '@zeus/room-client-browser'
          - '@zeus/http-contract'
          - '@zeus/rooms'
          - '@zeus/protocol'
          - '@zeus/authority-kit'
          - '@zeus/game-engine'
          - '@zeus/operator-bridge'
          - '@zeus/ui-3d-kit'
          - '@zeus/ui-kit'
          - '@zeus/app-shell'
          - '@zeus/test-utils'
          - '@zeus/solar-system'
          - '@zeus/linea-system'
          - '@zeus/linea-firehose'
          - '@zeus/console-monitor'
          - '@zeus/socket-server'
          - '@zeus/cache-browser'
          - '@zeus/firehose-browser'
          - '@zeus/editor-ui'
          - '@zeus/player-ui'
          - '@zeus/player-3d-ui'
          - '@zeus/3d-monitor'
          - '@zeus/ping-pong-bots'
          # WP-U256 — carril de datos (el que toca el disco del usuario).
          # Estaban fuera de la matriz: 176 tests que solo corrian en local.
          - '@zeus/linea-kit'
          - '@zeus/volumes-ops'
        # Solo el carril de datos recibe root de VOLUMES. No va en el `env`
        # comun del step porque para los 25 workspaces anteriores la variable
        # pasaria de «no definida» a «definida», y eso no esta medido. Via
        # `include` los 25 la reciben VACIA — medido equivalente a no
        # definirla: mismo exit code y mismo recuento pass/fail/skip en
        # 25 de 25 (WP-U256 §5).
        # WP-U261 saca a `@zeus/linea-system` de ese conjunto (pasa a recibir
        # root de verdad), asi que hoy son 24 los que la reciben vacia. El
        # «25 de 25» es la medida historica de U256 y no se re-mide aqui.
        include:
          - workspace: '@zeus/linea-kit'
            needs_volumes_root: true
          - workspace: '@zeus/volumes-ops'
            needs_volumes_root: true
          # WP-U261 — tercer consumidor del carril de datos. Sus dos ficheros de
          # test importan `src/start.mjs`, que resuelve el root de VOLUMES en
          # TIEMPO DE IMPORT (`src/loader.mjs:28`): sin root declarado el fichero
          # ni se carga y el job cae con el fail-closed de U200. El root NO le
          # trae el corpus vivo `espana` (no puede: candado `.gitignore:18-24`);
          # le trae la línea `demo`, que es contra la que asevera el caso
          # fail-closed de `test/smoke.mjs`.
          - workspace: '@zeus/linea-system'
            needs_volumes_root: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      # WP-U256 · el `env` de abajo tiene que ser OBSERVABLE desde la salida
      # de CI. Sin esta guarda, que la variable llegue o NO llegue produce
      # exactamente el mismo verde: mismo exit code, mismo recuento y la misma
      # linea `ok`; lo unico que cambia es un console.log enterrado. Es decir,
      # el arreglo seria el mismo defecto que vino a cerrar, un escalon arriba.
      #
      # El `if` se ancla en `matrix.workspace`, que es un valor ORIGINAL de la
      # matriz, y NO en `matrix.needs_volumes_root`, que es justo lo que se
      # esta verificando: si el merge del `include` fallara, esta guarda tiene
      # que correr igual y ponerse roja, no saltarse a si misma.
      - name: El carril de datos exige su root de VOLUMES (WP-U256)
        if: matrix.workspace == '@zeus/linea-kit' || matrix.workspace == '@zeus/volumes-ops'
        run: |
          test -n "$ZEUS_VOLUMES_ROOT" \
            || { echo "::error::ZEUS_VOLUMES_ROOT no llego al job: el include no aplico"; exit 1; }
          test -f "$ZEUS_VOLUMES_ROOT/volumes.json" \
            || { echo "::error::$ZEUS_VOLUMES_ROOT no es un root de VOLUMES"; exit 1; }
          test -f "$ZEUS_VOLUMES_ROOT/DISK_03/FORCES/registry.json" \
            || { echo "::error::sin DISK_03/FORCES/registry.json, forces-loader.test.mjs:62 vuelve a omitir en silencio"; exit 1; }
          echo "root declarado y completo: $ZEUS_VOLUMES_ROOT"
        env:
          ZEUS_VOLUMES_ROOT: ${{ matrix.needs_volumes_root && format('{0}/VOLUMES', github.workspace) || '' }}
      # WP-U261 · misma disciplina que la guarda de arriba, paso aparte porque la
      # precondición es OTRA: linea-system no lee DISK_03/FORCES, lee
      # DISK_02/LINEAS/registry.yaml. Exigirle un volumen que no usa sería un
      # rojo falso; compartir un paso con tres condiciones unidas, también.
      #
      # El `if` se ancla en `matrix.workspace` (valor ORIGINAL de la matriz) y NO
      # en `matrix.needs_volumes_root`, que es justo lo que verifica: si el merge
      # del `include` fallara, esta guarda corre igual y se pone ROJA en vez de
      # saltarse a sí misma.
      #
      # La tercera comprobación es la que importa: `registry.yaml` es LITERALMENTE
      # el fichero que `test/helpers/live-volumes.mjs:34-35,50` abre para decidir entre
      # aseverar y omitir. Sin él, el helper lanza y el job cae — pero cae con un
      # rastro de node; aquí cae con un mensaje que dice qué falta.
      - name: linea-system exige su root de VOLUMES (WP-U261)
        if: matrix.workspace == '@zeus/linea-system'
        run: |
          test -n "$ZEUS_VOLUMES_ROOT" \
            || { echo "::error::ZEUS_VOLUMES_ROOT no llego al job: el include no aplico"; exit 1; }
          test -f "$ZEUS_VOLUMES_ROOT/volumes.json" \
            || { echo "::error::$ZEUS_VOLUMES_ROOT no es un root de VOLUMES"; exit 1; }
          test -f "$ZEUS_VOLUMES_ROOT/DISK_02/LINEAS/registry.yaml" \
            || { echo "::error::sin DISK_02/LINEAS/registry.yaml no hay carril de lineas: smoke.mjs no puede aseverar el fail-closed"; exit 1; }
          echo "root declarado y con carril de lineas: $ZEUS_VOLUMES_ROOT"
        env:
          ZEUS_VOLUMES_ROOT: ${{ matrix.needs_volumes_root && format('{0}/VOLUMES', github.workspace) || '' }}
      - name: Test workspace
        run: npm test -w "${{ matrix.workspace }}"
        env:
          # Sin este root, linea-kit/test/forces-loader.test.mjs:57 se
          # auto-omite en silencio y se cuenta como `pass` (WP-U256 §4).
          # Y linea-system ni carga sus ficheros de test: `src/loader.mjs:28`
          # resuelve el root en tiempo de import (WP-U261 §1).
          ZEUS_VOLUMES_ROOT: ${{ matrix.needs_volumes_root && format('{0}/VOLUMES', github.workspace) || '' }}

  # WP-U258 — el root de referencia (VOLUMES/) esta SELLADO, y su evidencia
  # viaja RASTREADA. Job aparte de la matriz `test` a proposito: la vigilancia
  # de comportamiento (verde + los tres vectores rojos) ya corre dentro de
  # `test @zeus/volumes-ops` via
  # packages/engine/volumes-ops/test/sello-root-referencia.test.mjs, pero eso
  # depende de que esa fila siga en la matriz. Lo que SOLO se puede comprobar
  # en un checkout limpio —y ningun test local puede— es que los dos ficheros
  # que sostienen el sello esten TRACKEADOS: en el disco del operador existen
  # aunque `.gitignore` los excluya, asi que un candado mal puesto se ve verde
  # en local y rompe el arranque en el clon.
  sello-root:
    name: sello del root de referencia (U258)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Esta guarda NO se ancla en nada que ella misma produzca: pregunta al
      # INDICE de git. `git ls-files --error-unmatch` sale != 0 si el fichero
      # no esta rastreado, aunque exista en el arbol de trabajo.
      - name: La evidencia del sello viaja RASTREADA (no solo presente)
        run: |
          git ls-files --error-unmatch VOLUMES/volumes.json > /dev/null \
            || { echo "::error::VOLUMES/volumes.json no esta rastreado"; exit 1; }
          git ls-files --error-unmatch VOLUMES/.ops-ledger.jsonl > /dev/null \
            || { echo "::error::VOLUMES/.ops-ledger.jsonl no esta rastreado: sin el ledger, un manifiesto que declara volumenes importados es ledger_ausente y los CUATRO servicios no arrancan (verify.mjs, leg sello_vs_ledger)"; exit 1; }
          grep -q '"imported"' VOLUMES/volumes.json \
            || { echo "::error::VOLUMES/volumes.json dejo de estar sellado: sin source.imported la guarda de arranque omite todos los legs de volumen y pasa de largo (WP-U258)"; exit 1; }
      - name: Install
        run: npm ci
      # Se re-ejecuta aqui la vigilancia de comportamiento: si alguien saca
      # `@zeus/volumes-ops` de la matriz `test`, este job sigue corriendola.
      - name: Vigilancia del sello (verde + vectores rojos)
        run: node --test packages/engine/volumes-ops/test/sello-root-referencia.test.mjs

  # WP-U158 — consumidor TS tipado desde registry real (no tarball).
  # Skip limpio (exit 0 · ⏳) si el registry no responde — patrón U122.
  smoke-ts-registry:
    name: smoke TS registry (U158)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke TypeScript consumer from @zeus registry
        run: npm run smoke:ts-registry
        env:
          ZEUS_SMOKE_CLEANUP: '1'
